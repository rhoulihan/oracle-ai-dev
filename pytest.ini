[pytest]
testpaths = tests
# Put the repo root on sys.path so `import tooling` works under the `pytest` console
# script too (not only `python -m pytest`, which adds cwd). Fixes CI collection.
pythonpath = .
python_files = test_*.py
markers =
    live: requires Docker + Oracle images (opt in with ORACLE_AI_DEV_LIVE=1)
    shared_container: uses the session live_container fixture — the nightly's
        second serialized pass (self-managed compose stacks run first)
