<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="30" font-size="13" fill="#C74634" font-weight="700" text-anchor="start">HOW ORACLE-AI-DEV WORKS — REASON, THEN MEASURE</text>
<text x="24" y="48" font-size="10.5" fill="#5b6570" font-style="italic" text-anchor="start">Imagination is the LLM's job; the numbers are the tooling's.</text>
<rect x="24" y="95" width="160" height="210" rx="6" ry="6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<rect x="24" y="95" width="4" height="210" fill="#2563eb"/>
<text x="38" y="121" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">1 · INTAKE</text>
<text x="38" y="139" font-size="8.5" fill="#8a929b" text-anchor="start">agent-gathered</text>
<text x="38" y="163" font-size="10" fill="#1a1a1a" text-anchor="start">Entities and every</text>
<text x="38" y="179" font-size="10" fill="#1a1a1a" text-anchor="start">access pattern, ranked</text>
<text x="38" y="195" font-size="10" fill="#1a1a1a" text-anchor="start">by rate — reads AND</text>
<text x="38" y="211" font-size="10" fill="#1a1a1a" text-anchor="start">writes are patterns.</text>
<text x="38" y="227" font-size="10" fill="#5b6570" text-anchor="start"></text>
<text x="38" y="243" font-size="10" fill="#5b6570" text-anchor="start">Schema-validated</text>
<text x="38" y="259" font-size="10" fill="#5b6570" text-anchor="start">requirements.</text>
<rect x="210" y="95" width="185" height="210" rx="6" ry="6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<rect x="210" y="95" width="4" height="210" fill="#334155"/>
<text x="224" y="121" font-size="11" fill="#334155" font-weight="700" text-anchor="start">2 · REASON</text>
<text x="224" y="139" font-size="8.5" fill="#8a929b" text-anchor="start">the agent — skills prose</text>
<text x="224" y="163" font-size="10" fill="#1a1a1a" text-anchor="start">UMT rules + field lessons</text>
<text x="224" y="179" font-size="10" fill="#1a1a1a" text-anchor="start">propose candidate designs:</text>
<rect x="224" y="191" width="76" height="22" rx="5" ry="5" fill="#f8f8f8" stroke="#8a929b" stroke-width="1.2"/>
<text x="262.0" y="206" font-size="9" fill="#334155" text-anchor="middle">relational</text>
<rect x="309" y="191" width="76" height="22" rx="5" ry="5" fill="#f8f8f8" stroke="#8a929b" stroke-width="1.2"/>
<text x="347.0" y="206" font-size="9" fill="#334155" text-anchor="middle">document</text>
<rect x="224" y="220" width="76" height="22" rx="5" ry="5" fill="#f8f8f8" stroke="#8a929b" stroke-width="1.2"/>
<text x="262.0" y="235" font-size="9" fill="#334155" text-anchor="middle">hybrid</text>
<rect x="309" y="220" width="76" height="22" rx="5" ry="5" fill="#f8f8f8" stroke="#8a929b" stroke-width="1.2"/>
<text x="347.0" y="235" font-size="9" fill="#334155" text-anchor="middle">duality</text>
<rect x="224" y="249" width="76" height="22" rx="5" ry="5" fill="#f8f8f8" stroke="#8a929b" stroke-width="1.2"/>
<text x="262.0" y="264" font-size="9" fill="#334155" text-anchor="middle">summary</text>
<rect x="309" y="249" width="76" height="22" rx="5" ry="5" fill="#f8f8f8" stroke="#8a929b" stroke-width="1.2"/>
<text x="347.0" y="264" font-size="9" fill="#334155" text-anchor="middle">single table</text>
<text x="224" y="291" font-size="8.5" fill="#5b6570" font-style="italic" text-anchor="start">+ storage dimensions — not a menu</text>
<rect x="421" y="95" width="300" height="210" rx="6" ry="6" fill="#fdf6f5" stroke="#C74634" stroke-width="1.6"/>
<rect x="421" y="95" width="4" height="210" fill="#C74634"/>
<text x="435" y="121" font-size="11" fill="#C74634" font-weight="700" text-anchor="start">3 · MEASURE</text>
<text x="531" y="121" font-size="8.5" fill="#8a929b" text-anchor="start">deterministic tooling · live 26ai Free</text>
<rect x="436.0" y="135" width="270" height="28" rx="5" ry="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="571.0" y="153.5" font-size="9.5" fill="#1a1a1a" text-anchor="middle">deploy every shape + seed identically</text>
<line x1="571.0" y1="163" x2="571.0" y2="173" stroke="#C74634" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="436.0" y="173" width="270" height="28" rx="5" ry="5" fill="#ffffff" stroke="#C74634" stroke-width="1.4"/>
<text x="571.0" y="191.5" font-size="9.5" fill="#C74634" font-weight="600" text-anchor="middle">equivalence gate — same answer, or OUT</text>
<line x1="571.0" y1="201" x2="571.0" y2="211" stroke="#C74634" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="436.0" y="211" width="270" height="28" rx="5" ry="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="571.0" y="229.5" font-size="9.5" fill="#1a1a1a" text-anchor="middle">time reads &amp; writes, server-side</text>
<line x1="571.0" y1="239" x2="571.0" y2="249" stroke="#C74634" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="436.0" y="249" width="270" height="28" rx="5" ry="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="571.0" y="267.5" font-size="9.5" fill="#1a1a1a" text-anchor="middle">elect — rate-weighted, noise-floor gated</text>
<text x="571.0" y="295" font-size="9" fill="#5b6570" font-style="italic" text-anchor="middle">break-points show where the choice flips</text>
<rect x="747" y="95" width="190" height="210" rx="6" ry="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
<rect x="747" y="95" width="4" height="210" fill="#16a34a"/>
<text x="761" y="121" font-size="11" fill="#16a34a" font-weight="700" text-anchor="start">4 · SHIP</text>
<text x="761" y="139" font-size="8.5" fill="#8a929b" text-anchor="start">generated, verified</text>
<text x="761" y="163" font-size="10" fill="#1a1a1a" text-anchor="start">Winning DDL + indexes.</text>
<text x="761" y="179" font-size="10" fill="#1a1a1a" text-anchor="start">Data layer in 5 languages,</text>
<text x="761" y="195" font-size="10" fill="#1a1a1a" text-anchor="start">dot-notation queries —</text>
<text x="761" y="211" font-size="10" fill="#1a1a1a" text-anchor="start">one multivalue index</text>
<text x="761" y="227" font-size="10" fill="#1a1a1a" text-anchor="start">serves SQL and Mongo.</text>
<text x="761" y="243" font-size="10" fill="#5b6570" text-anchor="start"></text>
<text x="761" y="259" font-size="10" fill="#5b6570" text-anchor="start">Every plan checked.</text>
<line x1="184" y1="200" x2="208" y2="200" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="395" y1="200" x2="419" y2="200" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="721" y1="200" x2="745" y2="200" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="842.0" y1="305" x2="842.0" y2="356" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="842.0" y1="356" x2="302.5" y2="356" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="302.5" y1="356" x2="302.5" y2="307" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="572.25" y="348" font-size="9.5" fill="#334155" text-anchor="middle">measured lessons &amp; standards (.oracle-ai-dev/) feed the next run</text>
</svg>
